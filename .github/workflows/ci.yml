name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      # Milestone 4: offline policy eval is a hard CI gate (non-zero on gate failure).
      - run: pnpm eval:policy

  compat:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @osas/compat-suite test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: tests/compat/report/latest.json
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      # Milestone 4: conformance mode is enabled ONLY for this throwaway CI
      # Docker environment (test-only key, never a real secret). The default
      # elsewhere is off, and production startup refuses it entirely.
      OSAS_CONFORMANCE_MODE: "true"
      OSAS_CONFORMANCE_KEY: "ci-conformance-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs
          exit 1
      - name: Assert health payload
        run: |
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3001/health | grep -q '"specVersion":"0.1"'
      - name: Assert API endpoints
        run: |
          curl -fsS http://localhost:3001/v1/meta/tools | grep -q 'osas_core_get_case'
          curl -fsS http://localhost:3001/v1/cases | grep -q 'tenant_demo'
      - name: Assert compat report was generated at image build
        run: |
          report="$(curl -fsS http://localhost:3001/v1/compat/report)"
          echo "$report" | grep -Eq '"specVersion": *"0.1"'
          echo "$report" | grep -Eq '"ok": *true'
      - name: Black-box compat runner against the Docker API (conformance mode on)
        run: pnpm osas:compat -- --target http://localhost:3001 --out compat-runner-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-runner-report
          path: compat-runner-report.json
          if-no-files-found: warn
      - name: Assert web console served through nginx proxy
        run: |
          curl -fsS http://localhost:8080/ | grep -qi 'html'
          curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/healthz | grep -q '"service":"web"'
      - run: docker compose down
        if: always()

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @osas/e2e exec playwright install --with-deps chromium
      - run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Web console did not become healthy" >&2
          docker compose logs
          exit 1
      - run: E2E=1 E2E_BASE_URL=http://localhost:8080 pnpm test:e2e
      - run: docker compose down
        if: always()
