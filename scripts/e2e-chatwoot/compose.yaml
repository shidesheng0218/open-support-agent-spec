# Chatwoot for the OSAS shadow e2e. Derived from upstream docker-compose.production.yaml;
# postgres/redis publish no host ports. Only rails is bound, to 127.0.0.1.
x-base: &base
  image: chatwoot/chatwoot:latest
  env_file: .env
  volumes:
    - storage_data:/app/storage
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  rails:
    <<: *base
    depends_on: [postgres, redis]
    ports: ["127.0.0.1:3000:3000"]
    environment: [NODE_ENV=production, RAILS_ENV=production, INSTALLATION_ENV=docker]
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment: [NODE_ENV=production, RAILS_ENV=production, INSTALLATION_ENV=docker]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
  postgres:
    image: pgvector/pgvector:pg16
    volumes: [postgres_data:/var/lib/postgresql/data]
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${E2E_PG_PASSWORD}
  redis:
    image: redis:alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes: [redis_data:/data]

volumes:
  storage_data:
  postgres_data:
  redis_data:
